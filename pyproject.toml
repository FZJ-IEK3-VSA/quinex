[project]
name = "quinex"
description = "quinex extracts quantitative information (that is, quantities and their measurement context) from text"
version = "0.0.0"
authors = [
    {name = "Jan Göpfert"},
]
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: Unix",
    "Natural Language :: English",
    "Intended Audience :: Science/Research",     
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
]
keywords = [
    "quantitative information extraction",
    "numeric information extraction",
    "quantitative data extraction",
    "measurement extraction",
    "information extraction",
    "quantities",
    "measurements",
    "units",
    "NLP",
    "LLM",
]

dependencies = [
    "setuptools",
    "pip",
    "tqdm==4.67.3",
    "thefuzz[speedup]==0.22.1",
    "wasabi==1.1.3",
    "spacy==3.8.13",
    "torch==2.11.0",
    "transformers==4.57.6",  # last version supporting Text2TextGenerationPipeline, upgrade models or implementation before version bump
    "sentencepiece==0.2.1",
    "protobuf==7.34.1",
    "requests==2.33.1",
    "pandas==3.0.2",
    "text-processing-utils==0.0.0", 
    # "quinex-utils==0.0.0",    # TODO: upgrade numpy in quinex-utils
]

[project.urls]
Homepage = "https://github.com/FZJ-IEK3-VSA/quinex"
Issues = "https://github.com/FZJ-IEK3-VSA/quinex/issues"

[project.optional-dependencies]
api = [
    "fastapi==0.136.0",
    "uvicorn[standard]==0.45.0",
    "pydantic==2.13.3"
]
paper_analysis = [
    "fastapi==0.136.0",
    "uvicorn[standard]==0.45.0",
    "werkzeug==3.1.8",
    "pydantic==2.13.3",    
    "streamlit==1.56.0",
    "streamlit_agraph==0.0.45",
    "networkx==3.6.1",
    "pandas==3.0.2",
    "numpy==2.4.4",
    "lxml==6.1.0",
    "beautifulsoup4==4.14.3",
    "python-multipart==0.0.26",
]
plotting = [
    "scipy==1.17.1",
    "plotly==6.7.0",
    "numpy==2.4.4",
    "geopy==2.4.1",
    "kaleido==1.2.0"
]
optional = [
    "pymongo",
    "pymupdf",
    "papermage"
]

# Dev dependencies are dated and should be updated and tested with next model training
# dev = [    
#     "pytest",
#     "snakemake==7.32.4",
#     "tensorboard==2.15.1",
#     "sentence-transformers==2.2.2",
#     "datasets==2.16.1",
#     "accelerate==0.25.0",
#     "evaluate==0.4.1",
#     "seqeval==1.2.2",
#     "scikit-learn==1.3.2",
#     "optuna==3.5.0",
#     "numpy==1.26.3"
# ]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-data]
"quinex.config" = ["*.yml"]
"quinex.normalize.spatial_scope.static_resources" = ["*.json"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that load ML models (deselect with -m 'not slow')",
]